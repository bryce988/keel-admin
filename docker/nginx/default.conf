server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip：前端产物压缩后体积能小 60% 以上
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary         on;

    # 带 hash 的静态资源可长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后端接口：按端前缀转发，与 webman 多应用目录一一对应
    location ~ ^/(admin|client|open|ping) {
        proxy_pass         http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端 history 路由：任何未命中的路径都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # SPA 入口不缓存，避免发版后拿到旧壳子
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
