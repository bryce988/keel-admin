server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip：前端产物压缩后体积能小 60% 以上
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary         on;

    # 带 hash 的静态资源可长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 用户上传的文件（头像等）：存在后端的 public/uploads 下，不在前端产物里
    #
    # ⚠️ 必须用 `^~` 而不是普通前缀：头像是 .png/.jpg，会被上面那条
    # `~* \.(js|css|png|...)$` 的正则规则命中，去 /usr/share/nginx/html 找一个
    # 根本不存在的文件，结果是 404。nginx 的匹配顺序与规则在文件里的位置无关，
    # 靠的是修饰符优先级：`^~` 前缀命中后就不再试正则，这才是这里唯一的关键。
    location ^~ /uploads/ {
        proxy_pass         http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        # 文件名带随机串，内容不会变，可以放心长期缓存
        expires            30d;
        add_header         Cache-Control "public";
        access_log         off;
    }

    # 内部服务接口：**不对公网暴露**（PROJECT.md §8.1）
    #
    # 不写这条规则的话请求会落到下面的 SPA 兜底，返回 200 + 一张网页，
    # 看起来像「能访问」，排查时容易误判。
    # 返回 404 而不是 403：403 等于确认这个路径存在，与接口层「用 404 掩盖
    # 无权访问」的约定保持一致（docs/api.md §2.1）。
    location ^~ /internal/ {
        return 404;
    }

    # 后端接口：按端前缀转发，与 webman 多应用目录一一对应
    location ~ ^/(admin|client|open|ping) {
        proxy_pass         http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;

        # ⚠️ 这两行都是**覆盖式**，不要改成追加
        #
        # 原来 XFF 用的是 $proxy_add_x_forwarded_for（追加式），客户端自带的
        # X-Forwarded-For 会被原样保留在最左端；而应用层取的正是最左值。
        # 实测可以直接伪造：
        #     curl -H 'X-Forwarded-For: 1.2.3.4' .../open/ping → your_ip: 1.2.3.4
        # 波及 IP 白名单、限流、以及登录/操作日志的 IP 字段。
        #
        # 这里只有一层代理，$remote_addr 就是真实客户端地址，覆盖掉即可。
        # **前面若再加 CDN / SLB**，这两行要改成从上游头里取真实 IP
        # （如 $http_x_real_ip），否则记录到的会是回源节点地址。
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端 history 路由：任何未命中的路径都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # SPA 入口不缓存，避免发版后拿到旧壳子
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
