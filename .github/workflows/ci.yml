# 与 CONTRIBUTING.md「提交前跑一遍检查」跑的是同一组命令。
# 本地在容器里跑，CI 里直接装运行时跑，命令行为一致。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上新的推送取消还在跑的旧任务，别让排队堆起来
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 升到 v7 前核对过 v5~v7 的破坏性变更，两条都不影响我们：
      #   v5 会在 package.json 有 packageManager 字段时自动开缓存
      #   v6 把自动缓存限制到 npm
      # 这里 cache 与 cache-dependency-path 都是显式写的，
      # web/package.json 里也没有 packageManager 字段
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      # vue-tsc 不解析模板结构，必须连 vite build 一起跑才验得到 .vue 的 template
      - name: 类型检查 + 构建
        working-directory: web
        run: npm run check

  server:
    name: 后端语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-php 停在 v2：那是它当前的主版本（最新 2.37.x），不是落后版本
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl, pdo_mysql, sockets, zip, redis
          coverage: none

      - name: 安装依赖
        working-directory: server
        run: composer install --no-interaction --no-progress

      - name: composer validate + php -l
        working-directory: server
        run: composer check

      # 纯静态比对，不需要跑起来：BizCode.php 与 docs/api.md 的业务码必须一一对应
      - name: 业务码与文档一致性
        run: sh scripts/check-bizcode.sh

  acceptance:
    name: 权限与数据隔离验收
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 开发编排里每个变量都有默认值，CI 不需要 .env。
      # 只起验收用得到的三个服务：web 容器要跑一次 npm install（一两分钟），
      # 而验收脚本全程走 8787 端口的后端接口，一次都不碰前端
      - name: 起后端环境
        run: docker compose up -d --wait --wait-timeout 300 mysql redis server

      - name: 等后端就绪
        run: |
          for i in $(seq 1 60); do
            curl -sf -m 3 http://localhost:8787/admin/ping >/dev/null && exit 0
            sleep 5
          done
          echo "后端 300 秒内未就绪"
          docker compose logs --no-color server
          exit 1

      # entrypoint 里 install.php / seed.php 的失败是被 `|| echo` 吞掉的，
      # 服务照样起得来。缺了种子数据的表现是「验收在登录那步失败」，
      # 与网络问题、密码不对长得一模一样。这里提前把它区分出来。
      - name: 确认种子数据就绪
        run: |
          need="admin manager dev01 ops01"
          missing=""
          for u in $need; do
            n=$(docker compose exec -T mysql mysql -ukeel -pkeel123456 -N keel \
                  -e "SELECT COUNT(*) FROM sys_users WHERE username='$u' AND deleted_at IS NULL" 2>/dev/null | tr -d '\r')
            [ "$n" = "1" ] || missing="$missing $u"
          done
          perms=$(docker compose exec -T mysql mysql -ukeel -pkeel123456 -N keel \
                    -e "SELECT COUNT(*) FROM sys_permissions" 2>/dev/null | tr -d '\r')
          echo "权限点 $perms 条；缺失账号:${missing:-无}"
          if [ -n "$missing" ] || [ "${perms:-0}" -lt 40 ]; then
            echo "✗ 种子数据不完整，entrypoint 的 install/seed 很可能失败了："
            docker compose logs --no-color server | tail -60
            exit 1
          fi

      - name: 跑验收脚本
        run: sh scripts/acceptance.sh

      - name: 失败时导出容器日志
        if: failure()
        run: docker compose logs --no-color
